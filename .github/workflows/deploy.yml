name: CI & Deploy

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⎔ Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: Validate types, content, regression tests, and Worker packaging
        run: npm run validate
        env:
          ASTRO_TELEMETRY_DISABLED: 1

      - name: 🚀 Deploy to Cloudflare Workers (Static Assets)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing. Restore the deployment secret from Private 1Password."
            exit 1
          fi
          # Upload and deploy only this run's version. Domain/route management
          # stays with local Wrangler OAuth, outside the CI token's permissions.
          deployment_tag="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npx wrangler versions upload --tag "$deployment_tag"
          npx wrangler versions deploy --version-tag "$deployment_tag@100" --yes
          npm run smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
